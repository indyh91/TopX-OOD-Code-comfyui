name: ComfyUI integration contracts

on:
  push:
    branches: [main, production-cache-batch-glb-bridge]
  pull_request:

jobs:
  static-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install non-GPU test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Python syntax verification
        run: python -m compileall -q __init__.py comfy_nodes.py topx_runtime.py glb_bridge.py scripts src tests
      - name: Unit and roundtrip tests
        run: python -m pytest tests/test_comfy_nodes.py -q
      - name: Confirm live GPU test is opt-in
        run: python -m pytest tests/test_live_inference.py -q
